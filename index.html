  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #FAFAF9;
      --card: #FFFFFF;
      --border: #E2E4E8;
      --text: #1A1D23;
      --text-secondary: #5E6370;
      --text-muted: #8A8F9A;
      --accent: #E04E2A;
      --accent-bg: rgba(224, 78, 42, 0.06);
      --sidebar-w: 280px;
    }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "rlig" 1, "calt" 1;
    }

    .layout { display: flex; height: 100vh; }

    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-header img.logo { height: 24px; width: auto; }
    .sidebar-header img.wordmark { height: 16px; width: auto; }

    .sidebar-section-label {
      padding: 16px 20px 8px;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .template-list { padding: 8px; flex: 1; }

    .template-item {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      border-radius: 8px;
      padding: 12px 14px;
      cursor: pointer;
      font-family: inherit;
      transition: background-color 0.15s;
    }

    .template-item:hover { background: var(--bg); }
    .template-item.active { background: var(--accent-bg); }
    .template-item.active .template-name { color: var(--accent); }

    .template-name { font-size: 13px; font-weight: 600; color: var(--text); display: block; }

    .template-subject {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
      display: block;
      line-height: 1.4;
    }

    .template-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }

    .template-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .badge-transactional { background: hsl(152 69% 40% / 0.1); color: hsl(152 69% 30%); }
    .badge-digest { background: hsl(14 78% 54% / 0.08); color: hsl(14 78% 42%); }
    .badge-marketing { background: hsl(220 70% 50% / 0.1); color: hsl(220 70% 40%); }

    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .toolbar-title { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; }

    .viewport-buttons {
      display: flex;
      gap: 2px;
      background: var(--bg);
      padding: 3px;
      border-radius: 8px;
    }

    .viewport-btn {
      background: none;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }

    .viewport-btn:hover { color: var(--text); }

    .viewport-btn.active {
      background: var(--card);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    .source-btn {
      background: none;
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }

    .source-btn:hover { background: var(--bg); color: var(--text); }

    .source-btn.active {
      background: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
    }

    .preview-container {
      flex: 1;
      display: flex;
      justify-content: center;
      overflow-y: auto;
      padding: 32px 20px;
      background: #F0F1F3;
    }

    .preview-frame-wrapper { transition: width 0.3s ease; height: fit-content; }
    .preview-frame-wrapper.desktop { width: 700px; }
    .preview-frame-wrapper.tablet  { width: 480px; }
    .preview-frame-wrapper.mobile  { width: 375px; }

    .preview-frame {
      width: 100%;
      border: none;
      background: var(--bg);
      border-radius: 10px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(0, 0, 0, 0.06);
    }

    .source-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #1A1D23;
      display: none;
    }

    .source-container.visible { display: block; }

    .source-container pre {
      margin: 0;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #C9D1D9;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>

  <script>
    const templates = [
      {
        id: 'magic-link',
        name: 'Magic Link',
        subject: 'Your sign-in link for ChurnWire',
        type: 'transactional',
        scriptId: 'tpl-magic-link',
      },
      {
        id: 'digest',
        name: 'Daily Digest',
        subject: '5 customers need attention — ChurnWire Daily',
        type: 'digest',
        scriptId: 'tpl-digest',
      },
      {
        id: 'digest-empty',
        name: 'Daily Digest (empty)',
        subject: '0 customers need attention — ChurnWire Daily',
        type: 'digest',
        scriptId: 'tpl-digest-empty',
      },
      {
        id: 'welcome',
        name: 'Welcome',
        subject: 'Welcome to ChurnWire — let\'s get started',
        type: 'marketing',
        scriptId: 'tpl-welcome',
      },
      {
        id: 'trial-ending',
        name: 'Trial Ending',
        subject: '3 days left on your trial',
        type: 'marketing',
        scriptId: 'tpl-trial-ending',
      },
      {
        id: 'win-back',
        name: 'Win-back',
        subject: 'Your customers showed churn signals while you were away',
        type: 'marketing',
        scriptId: 'tpl-win-back',
      },
      {
        id: 'feature-announcement',
        name: 'Feature Announcement',
        subject: 'New in ChurnWire: Feature Name',
        type: 'marketing',
        scriptId: 'tpl-feature-announcement',
      },
      {
        id: 'case-study',
        name: 'Case Study',
        subject: 'How Acme SaaS saved $4,200/mo in MRR',
        type: 'marketing',
        scriptId: 'tpl-case-study',
      },
    ];

    const listEl = document.getElementById('templateList');
    const frameWrapper = document.getElementById('frameWrapper');
    const previewFrame = document.getElementById('previewFrame');
    const previewContainer = document.getElementById('previewContainer');
    const sourceContainer = document.getElementById('sourceContainer');
    const sourceCode = document.getElementById('sourceCode');
    const toolbarTitle = document.getElementById('toolbarTitle');
    const sourceToggle = document.getElementById('sourceToggle');

    let showingSource = false;

    templates.forEach((t) => {
      const btn = document.createElement('button');
      btn.className = 'template-item';
      btn.dataset.id = t.id;
      btn.innerHTML = `
        <span class="template-name">${t.name}</span>
        <span class="template-subject">${t.subject}</span>
        <div class="template-meta">
          <span class="template-badge badge-${t.type}">${t.type}</span>
        </div>
      `;
      btn.addEventListener('click', () => selectTemplate(t));
      listEl.appendChild(btn);
    });

    function selectTemplate(t) {
      toolbarTitle.textContent = t.name;

      document.querySelectorAll('.template-item').forEach((el) => {
        el.classList.toggle('active', el.dataset.id === t.id);
      });

      const html = document.getElementById(t.scriptId).textContent;

      const doc = previewFrame.contentDocument;
      doc.open();
      doc.write(html);
      doc.close();

      setTimeout(resizeFrame, 150);

      sourceCode.textContent = html.trim();
    }

    function resizeFrame() {
      try {
        const h = previewFrame.contentDocument.documentElement.scrollHeight;
        previewFrame.style.height = h + 'px';
      } catch (e) {}
    }

    document.querySelectorAll('.viewport-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.viewport-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        frameWrapper.className = 'preview-frame-wrapper ' + btn.dataset.viewport;
        setTimeout(resizeFrame, 350);
      });
    });

    sourceToggle.addEventListener('click', () => {
      showingSource = !showingSource;
      sourceToggle.classList.toggle('active', showingSource);
      previewContainer.style.display = showingSource ? 'none' : 'flex';
      sourceContainer.classList.toggle('visible', showingSource);
    });

    selectTemplate(templates[0]);
  </script>
